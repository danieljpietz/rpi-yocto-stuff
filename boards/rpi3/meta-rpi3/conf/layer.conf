BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi3"
BBFILE_PATTERN_rpi3 = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi3 = "9"
LAYERSERIES_COMPAT_rpi3 = "scarthgap"

# Raspberry Pi 3 (64-bit) machine settings

# Serial console is handy since this is a headless, stripped-down board
ENABLE_UART:raspberrypi3-64 = "1"

# SD-card image (flash with dd) plus the rootfs used by SWUpdate bundles
IMAGE_FSTYPES:raspberrypi3-64 = "wic.bz2 ext4.gz"

# systemd as init (poky defaults to sysvinit)
INIT_MANAGER = "systemd"

# Boot through U-Boot, which handles A/B slot selection and rollback
RPI_USE_U_BOOT:raspberrypi3-64 = "1"
WKS_FILE:raspberrypi3-64 = "rpi3-ab.wks"

# Hypervisor features: KVM/libvirt-related distro features
DISTRO_FEATURES:append:raspberrypi3-64 = " virtualization"

# Userspace hypervisor stack provided by meta-hypervisor
IMAGE_INSTALL:append:raspberrypi3-64 = " ${HYPERVISOR_PACKAGES}"

# OTA updates via SWUpdate (from meta-swupdate)
IMAGE_INSTALL:append:raspberrypi3-64 = " swupdate swupdate-www swupdate-ab-config ab-boot-confirm"

# Shallow-clone git sources (e.g. the full raspberrypi/linux.git history
# is 10+ GB) instead of mirroring the whole upstream repo/history.
BB_GIT_SHALLOW = "1"
BB_GIT_SHALLOW_DEPTH = "1"
