# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hypervisor"
BBFILE_PATTERN_hypervisor = "^${LAYERDIR}/"
BBFILE_PRIORITY_hypervisor = "10"
LAYERSERIES_COMPAT_hypervisor = "scarthgap"

# Exported for board layers/images to append to:
#
#   IMAGE_INSTALL:append = " ${HYPERVISOR_PACKAGES}"
#   SRC_URI:append       = " ${HYPERVISOR_KERNEL_CFG}"   (kernel bbappend)
#   FILESEXTRAPATHS:prepend := "${HYPERVISOR_KERNEL_FILES}:"
HYPERVISOR_PACKAGES = "packagegroup-hypervisor"
HYPERVISOR_KERNEL_CFG = "file://hypervisor-kvm.cfg file://hypervisor-vm-net.cfg"
HYPERVISOR_KERNEL_FILES := "${LAYERDIR}/recipes-kernel/linux/files"
