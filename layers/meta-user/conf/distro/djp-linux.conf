# djp-linux: Poky-based distro. Inherit Poky's policy, then override identity.
require conf/distro/poky.conf

DISTRO = "djp-linux"
DISTRO_NAME = "djp-linux"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "scarthgap"

MAINTAINER = "Daniel Pietz <danieljpietz@gmail.com>"
SDK_VENDOR = "-djpsdk"

# Write build info (distro, machine, layer revisions, timestamp) to
# /etc/buildinfo in every image.
INHERIT += "image-buildinfo"
IMAGE_BUILDINFO_VARS = "DISTRO DISTRO_VERSION MACHINE"
